# ---------------------------------------------------------------------------
# Custom scrape config for Managed Prometheus. The ama-metrics agent (enabled
# by monitor_metrics {} in Terraform) loads this ConfigMap and scrapes any pod
# annotated prometheus.io/scrape=true in the llm + gateway namespaces. vLLM
# serves its metrics at :8000/metrics; LiteLLM at :4000/metrics.
#
# Apply, then restart the agent:  kubectl -n kube-system rollout restart ds/ama-metrics-node
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |-
    scrape_configs:
      - job_name: vllm
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [llm]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: litellm
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [gateway]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
