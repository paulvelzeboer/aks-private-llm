# ---------------------------------------------------------------------------
# In-cluster egress lockdown. The firewall + UDR stop traffic at the VNet edge;
# these policies stop it one layer earlier, at the pod. Default is deny-all
# egress in the llm namespace. The model server may talk to nothing outbound
# except cluster DNS. It cannot even reach other namespaces.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS is the only egress the model pods get.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Only the gateway namespace may reach the model server, only on 8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-vllm
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - { protocol: TCP, port: 8000 }
---
# Gateway namespace: deny-all egress, then allow DNS + the model service only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-vllm-egress
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
      ports:
        - { protocol: TCP, port: 8000 }
---
# Clients on the VNet reach the gateway on 4000 through the internal LB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vnet-to-gateway
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - { protocol: TCP, port: 4000 }
